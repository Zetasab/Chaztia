<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chaztia - Chatea con IA</title>
    <meta name="description" content="Chaztia es un asistente de chat con IA, rápido y sencillo, pensado para desarrolladores." />

    <!-- Open Graph / Facebook, WhatsApp, LinkedIn, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chaztia" />
    <meta property="og:title" content="Chaztia - Chatea con IA" />
    <meta property="og:description" content="Chaztia es un asistente de chat con IA, rápido y sencillo, pensado para desarrolladores." />
    <meta property="og:url" content="https://chaztia.vercel.app" />
    <meta property="og:image" content="https://chaztia.vercel.app/favicon.png" />
    <meta property="og:image:width" content="768" />
    <meta property="og:image:height" content="768" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chaztia - Chatea con IA" />
    <meta name="twitter:description" content="Chaztia es un asistente de chat con IA, rápido y sencillo, pensado para desarrolladores." />
    <meta name="twitter:image" content="https://chaztia.vercel.app/favicon.png" />

    <!-- iOS: añadir a pantalla de inicio como app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chaztia" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- PWA / theming general -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#141414" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #141414;
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      #splash img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        animation: splash-pulse 1.6s ease-in-out infinite;
        filter: drop-shadow(0 0 24px rgba(66, 133, 244, 0.45));
      }
      #splash .splash-dots {
        display: flex;
        gap: 8px;
      }
      #splash .splash-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: conic-gradient(from 0deg, #4285f4, #9b72cb, #d96570, #f2a33c, #4285f4);
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      #splash .splash-dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      #splash .splash-dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      #splash.splash-hide {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      @keyframes splash-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.85;
        }
      }
      @keyframes splash-dot {
        0%, 80%, 100% {
          transform: scale(0.6);
          opacity: 0.5;
        }
        40% {
          transform: scale(1.4);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash .splash-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/favicon.png" alt="ChaztIa" />
      <div class="splash-dots">
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var splash = document.getElementById('splash')
          if (!splash) return
          splash.classList.add('splash-hide')
          setTimeout(function () {
            splash.remove()
          }, 550)
        }, 700)
      })
    </script>
  </body>
</html>
